[package]
name = "shimi"
version = "0.0.7"
edition = "2024"
authors = ["Shaked F."]

[features]
default = []
dry_run = []

[dependencies]
tap = "1.0.1" # Allows to tap/pipe/conv on any variable

clap = { version = "4.5.17", features = ["derive", "cargo", "env", "string"] } # Handles parsing input from command line

anyhow = { version = "1.0.97" } # Error handling

email_address = "0.2.9" # Validates email address
xdg-home = "1.3.0" # Gets the user's home directory

time = { version = "0.3.41", features = ["local-offset", "formatting", "macros"] } # Date and time handling
hashbrown = { version = "0.15.2", features = ["serde"] } # HashMap and HashSet

env_logger = { version = "0.11.8" } # Environment variables for the logger
colog = { version = "1.3.0" } # Logger Formatter
log = { version = "0.4.27" } # Logger

serde = { version = "1.0.219", features = ["derive"] } # Serialize and deserialize data
strum = { version = "0.27.1", features = ["derive"] } # Enum utilities

ron = { version = "0.10.1" } # Ron format
colored = { version = "3.0.0" } # Color strings for the terminal
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] } # Interactive command line dialog

